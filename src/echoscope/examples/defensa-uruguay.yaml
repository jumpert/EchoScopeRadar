version: 1
sources:
  - id: telenoche
    type: syndication
    label: Telenoche · Nacionales
    params: {url: 'https://www.telenoche.com.uy/rss/pages/nacionales.xml', kind: NEWS_ARTICLE}
  - id: subrayado
    type: syndication
    label: Subrayado · Nacional
    params: {url: 'https://www.subrayado.com.uy/rss/pages/nacional.xml', kind: NEWS_ARTICLE}
  - id: montevideo-portal
    type: syndication
    label: Montevideo Portal · Noticias
    params: {url: 'https://www.montevideo.com.uy/anxml.aspx?59', kind: NEWS_ARTICLE}
  - id: el-observador
    type: syndication
    label: El Observador · Nacional
    params: {url: 'https://www.elobservador.com.uy/rss/pages/nacional.xml', kind: NEWS_ARTICLE}
jobs:
