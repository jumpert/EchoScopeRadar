    - {id: ejercito-nacional, phrase: Ejército Nacional, severity: important}
    - {id: ejercito, phrase: Ejército}
    - {id: fuerzas-armadas, phrase: Fuerzas Armadas}
    - {id: esmade, phrase: Estado Mayor de la Defensa}
