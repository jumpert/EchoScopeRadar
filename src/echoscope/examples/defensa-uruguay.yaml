  - {id: montevideo-portal, source: montevideo-portal, interval_s: 900, rule_set: defensa, relevant_only: true}
  - {id: el-observador, source: el-observador, interval_s: 900, rule_set: defensa, relevant_only: true}
rule_sets:
  defensa:
