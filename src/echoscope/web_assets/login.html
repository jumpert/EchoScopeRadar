<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · EchoScope Radar</title><link rel="stylesheet" href="/app.css"><link rel="icon" href="/ciberdefensa.png">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="login-page">
    <form id="login" class="card login-card">
      <img src="/ciberdefensa.png" alt="" width="52" height="52">
      <h1>EchoScope Radar</h1><p>Iniciá sesión para abrir tu espacio de monitoreo.</p>
      <label for="login-name">Usuario</label><input id="login-name" autocomplete="username" maxlength="40" required>
      <label for="login-password">Contraseña</label><input id="login-password" type="password" autocomplete="current-password" maxlength="256" required>
      <button class="button primary" type="submit">Iniciar sesión</button><p id="login-status" role="status"></p>
    </form>
  </main>
</body>
</html>
