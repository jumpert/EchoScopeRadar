[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "echoscope-radar"
version = "0.12.0"
description = "Local monitoring workspace for news, comments and live chats"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.12,<4", "aiosqlite>=0.21,<1", "alembic>=1.15,<2",
    "cryptography>=44,<51", "defusedxml>=0.7,<1", "filelock>=4.2.10,<5", "platformdirs>=4,<5",
    "pydantic>=2.10,<3", "python-dotenv>=1,<2", "PyYAML>=6,<7", "regex>=2024.11",
    "reportlab>=4.4,<5", "rich>=14,<15", "sqlalchemy>=2.0.38,<2.1", "textual>=6,<9", "typer>=0.16,<1",
]

[project.optional-dependencies]
youtube = ["grpcio>=1.68,<2", "protobuf>=7.35.1,<8"]
windows-build = ["pyinstaller>=6,<7; sys_platform == 'win32'"]

[project.scripts]
echoscope = "echoscope.presentation.cli:main"
echoscope-web = "echoscope.presentation.web:main"

[project.gui-scripts]
echoscope-desktop = "echoscope.presentation.desktop:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "trustme>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
echoscope = ["examples/*.yaml", "connectors/*.proto", "connectors/LICENSE.youtube", "web_assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["internet: opt-in live network verification", "performance: opt-in ten-source benchmark"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cache", "*_pb2.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
